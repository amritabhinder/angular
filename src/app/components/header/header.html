<header class="header">
  <div class="header-content">
    <div class="nav-links">
      <a routerLink="/" class="store-name">Amrita's Store</a>
      <a routerLink="/products/all" class="home-link">Home</a>
    </div>
    <div class="search-box">
      <input
        type="text"
        placeholder="Search products..."
        [ngModel]="searchState.searchTerm()"
        (ngModelChange)="searchState.searchTerm.set($event)"
      />
      <span class="search-icon">&#128269;</span>
    </div>
    <a routerLink="/cart" class="cart-btn">
      <span class="cart-icon">&#128722;</span>
      Cart
      @if (cartService.totalItems() > 0) {
        <span class="cart-badge">{{ cartService.totalItems() }}</span>
      }
    </a>
  </div>
</header>
